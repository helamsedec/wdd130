<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Exercise</title>
    <link rel="stylesheet" href="styles/table-exercise-solution.css">
</head>

<body>
    <table>
        <thead>
            <tr>
                <th scope="col"> League</th>
                <th scope="col"> Team</th>
                <th scope="col"> Record</th>
                <th scope="col"> Player Count</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="2"> Southern</th>
                <th>Parana</th>
                <th>52-19</th>
                <th>23</th>
            </tr>
            <tr>
                <th>Catarina</th>
                <th>49-24</th>
                <th>10</th>
            </tr>
            <tr>
                <th rowspan="3"> Western</th>
                <th>Lacerda</th>
                <th>92-70</th>
                <th>27</th>
            </tr>
            <tr>
                <th>Acre</th>
                <th>75-87</th>
                <th>20</th>
            </tr>
            <tr>
                <th>Rondomia</th>
                <th>10-7</th>
                <th>12</th>
            </tr>
        </tbody>
        <tfoot>
            <th scope="row" colspan="3"> Total Players</th>
            <th scope>92</th>
        </tfoot>

    </table>
</body>

</html>
