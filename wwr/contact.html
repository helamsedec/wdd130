<!DOCTYPE html>
<html lang="en">

<head>
    <title>Contact Us - Rafting Company Adventures</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Get in touch with Rafting Company Adventures for inquiries, reservations, and location details.">
    <meta name="author" content="Helam Sedec Martínez Chávez">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header class="grid">
        <img src="images/raftinglogo.jpg" alt="Rafting Image Logo" class="logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html" target="_blank">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="company-info">
            <h1>Rafting Company Adventures</h1>
            <p><strong>Address:</strong>123 Main River Street, Kolob, California</p>
            <p><strong>Phone:</strong>+1 999 999 9999</p>
            <p><strong>Email:</strong>info@raftingadventure.com</p>
        </section>
        <section class="contact-grid">
            <div class="map-box">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d28185.500755498037!2d86.9253667!3d27.988156449999998!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x39e854a215bd9ebd%3A0x576dcf806abbab2!2sMonte%20Everest!5e0!3m2!1ses!2smx!4v1795840522128!5m2!1ses!2smx" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" title="Rafting Company Adventures Location Map">
                </iframe>
            </div>

            <form action="#" method="post" class="contact-form"">
                <div class=" form-row">

                <label for="user-name">Name</label>
                <input type="text" id="user-name" name="user-name" placeholder="Your full name" required>
                </div>
                <div class="form-row">
                    <label for="user-email">Email:</label>
                    <input type="email" id="user-email" name="user-email" placeholder="you@example.com" required>
                </div>

                <fieldset class="radio-group">
                    <legend>Message Purpose</legend>

                    <div class="radio-option">
                        <input type="radio" id="general-inquiry" name="purpose" value="general-inquiry" required>
                        <label for="general-inquiry">General Inquiry</label>
                    </div>

                    <div class="radio-option">
                        <input type="radio" id="reservation-question" name="purpose" value="reservation-question">
                        <label for="reservation-question">Reservation Question</label>
                    </div>

                    <div class="radio-option">
                        <input type="radio" id="website-suggestion" name="purpose" value="website-suggestion">
                        <label for="website-suggestion">Website Suggestion</label>
                    </div>
                </fieldset>

                <div class="form-row">
                    <label for="user-message">Message:</label>
                    <textarea id="user-message" name="user-message" rows="4" placeholder="Write your message here..." required></textarea>
                </div>

                <div class="checkbox-row">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Please subscribe me to the monthly newsletter</label>
                </div>

                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </section>

        <section class="employees-section">
            <h2>We Are Here to Serve You</h2>
            <div class="employees-grid">
                <figure>
                    <img src="images/helam_martinez.jpg" alt="Portrait of Helam Martínez, Lead River Guide">
                    <figcaption>Helam Martínez — Lead River Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/david_torres.jpg" alt="Portrait of David Torres, Safety Coordinator">
                    <figcaption>David Torres — Safety Coordinator</figcaption>
                </figure>
                <figure>
                    <img src="images/fernanda_mendoza.jpg" alt="Portrait of Fernanda Mendoza, Trip Planner">
                    <figcaption>Fernanda Mendoza — Trip Planner</figcaption>
                </figure>
            </div>
        </section>

    </main>
    <footer>
        <p>&copy; 2026 Our Company. All rights reserved.</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook" width="30">
            </a>
            <a href="https://tiktok.com">
                <img src="images/tiktok.png" alt="TikTok" width="30">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="Instagram" width="30">
            </a>
        </nav>
    </footer>
</body>

</html>
