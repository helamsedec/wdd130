<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="A basic HTML structure example using semantic HTML elements">
    <meta name="author" content="Helam Sedec Martínez Chávez">
    <title>Basic HTML Structure</title>
</head>

<body>
    <header>
        <img src="images/basic-logo.png" alt="Logo de la Pagina" width="128" height="128">
    </header>
    <nav>
        <ul>
            <li><a href="https//byui.edu">BYU-Idaho</a></li>
            <li><a href="https://churchofjesuchrist.org">The Church</a></li>
        </ul>
    </nav>
    <main>
        <h1>Basic HTML Structure</h1>
        <section>
            <h2>Heading 1</h2>
            <h2>In this web you will find how to go with the official BYU Idaho page</h2>
        </section>
        <section>
            <h2>Heading 2</h2>
            <h2>Also you'll find the link to go the official Church of Jesus Christ link</h2>
        </section>
    </main>
    <aside>
        <img src="https://cdn.britannica.com/19/175319-050-109FC469/Mormon-temple-Salt-Lake-City-Utah.jpg?w=300" alt="Salt Lake City Temple" width="200" </aside>
        <footer>
            <p>Helam Martínez</p>
        </footer>
</body>

</html>
